name: Validate and deploy GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-build:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test question bank and quiz logic
        run: npm test
      - name: Build static website
        run: npm run build
      - name: Install browser test tooling
        run: |
          npm ci
          npx playwright install --with-deps --only-shell chromium webkit
          sudo apt-get install -y fonts-noto-cjk
      - name: Verify Chromium interactions
        run: npm run test:browser
      - name: Verify WebKit interactions
        run: npm run test:browser
        env:
          QA_BROWSER: webkit
      - name: Upload browser verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-verification
          path: /tmp/apple-trivia-qa/
          retention-days: 7
      - name: Record expected release
        id: release
        run: node -p '"version=" + JSON.parse(require("node:fs").readFileSync("package.json", "utf8")).version' >> "$GITHUB_OUTPUT"
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate-build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify deployed Pages site
        shell: bash
        run: |
          site="https://yunnre060214-sudo.github.io/Apple-Trivia/"
          expected="${{ needs.validate-build.outputs.version }}"
          for attempt in 1 2 3 4 5; do
            http_code="$(curl --silent --show-error --location --output /tmp/apple-trivia-index.html --write-out '%{http_code}' --connect-timeout 10 --max-time 20 "${site}?v=${expected}" || true)"
            asset_code="$(curl --silent --show-error --location --output /tmp/apple-trivia-app.mjs --write-out '%{http_code}' --connect-timeout 10 --max-time 20 "${site}assets/app.mjs?v=${expected}" || true)"
            version_code="$(curl --silent --show-error --location --output /tmp/apple-trivia-version.json --write-out '%{http_code}' --connect-timeout 10 --max-time 20 "${site}version.json?v=${expected}" || true)"
            if [ "$http_code" = "200" ] && [ "$asset_code" = "200" ] && [ "$version_code" = "200" ] \
               && grep -q '<title>Apple Trivia' /tmp/apple-trivia-index.html \
               && grep -Fq "./assets/app.mjs?v=${expected}" /tmp/apple-trivia-index.html \
               && grep -Fq "../src/engine.mjs?v=${expected}" /tmp/apple-trivia-app.mjs \
               && EXPECTED_VERSION="$expected" node -e 'const data=JSON.parse(require("node:fs").readFileSync("/tmp/apple-trivia-version.json","utf8"));process.exit(data.version===process.env.EXPECTED_VERSION?0:1)'; then
              echo "Verified live site, JavaScript and version.json at v${expected}: $site"
              cat /tmp/apple-trivia-version.json
              exit 0
            fi
            echo "Attempt $attempt: index=$http_code app.mjs=$asset_code version.json=$version_code"
            sleep 3
          done
          echo "GitHub Pages public smoke test failed for $site" >&2
          exit 1
